name: Static site validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile link checker
        run: python3 -m py_compile scripts/check_local_links.py

      - name: Validate local links and fragments
        run: python3 scripts/check_local_links.py
